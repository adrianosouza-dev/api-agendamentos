name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.banco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SQLite: o banco do desenvolvimento local. Postgres: o banco de produção,
        # onde também roda a trava contra agendamentos sobrepostos.
        banco: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: ${{ matrix.banco == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/testes' || '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Rodar testes
        run: pytest -v
      - name: Conferir se as migrations batem com os modelos
        if: matrix.banco == 'postgres'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testes
          SECRET_KEY: chave-so-para-o-ci-com-32-bytes-ou-mais
          ADMIN_SENHA: senha-do-ci
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  docker:
    name: Docker (API + Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem e subir com o docker compose
        # --wait espera os healthchecks: Postgres pronto e /saude da API respondendo
        run: docker compose up --build --detach --wait
      - name: Conferir a API rodando no container
        run: |
          curl --fail --silent http://localhost:8000/saude
          echo
          curl --fail --silent http://localhost:8000/servicos \
            | python3 -c "import sys, json; s = json.load(sys.stdin); assert len(s) == 5, s; print(len(s), 'serviços de exemplo')"
          curl --fail --silent --output /dev/null http://localhost:8000/
          docker compose exec -T api alembic current
      - name: Logs dos containers (se algo falhar)
        if: failure()
        run: docker compose logs
      - name: Desligar
        if: always()
        run: docker compose down --volumes
